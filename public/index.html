<!doctype html>
<html lang='en'>
  <head>
        <title>Cookbook - CS4241 Assignment 3</title>
        <meta charset='utf-8'>
        <script src='js/main.js'></script>
        <!--beer.css-->
        <link href="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.css" rel="stylesheet">
        <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.js"></script>
        <script type="module" src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.4/dist/cdn/material-dynamic-colors.min.js"></script>
        <!--my overrides-->
        <link rel='stylesheet' href='css/main.css' >
        <!-- get rid of favicon error -->
        <link rel='icon' href='data:;base64,iVBORw0KGgo='>
        <meta name='description' content='The login page to access the Cookbook recipe manager'>

  </head>
    <body class = "responsive light">
      <header class = "top-margin small-blur medium-width round center">
        <nav>
          <h1 class = 'max center-align'>Cookbook</h1>
        </nav>
      </header>
      <main>
        <div class="row center-align medium-height">
          <article class="surface-variant dark center-align">
            <form id='login' action='/login' method='POST'>
              <blockquote> If no account with the entered username exists, one will be created upon login</blockquote>
              <div class="field label">
                <input type='text' name='username'>
                <label for='username'>Username:</label>         
              </div>
              <div class="field label">
                <input type='password' name='password'>
                  <label for='password'>Password:</label>
              </div>
              <div class="padding">
                  <button type='submit' class ='primary'>Log In</button>
              </div>
            </form>
          </article>  
        </div>
      </main>
    </body>
</html>
