<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 2</title>
    <meta charset='utf-8'>
    <script src='js/main.js'></script>
    <link rel='stylesheet' href='css/main.css' >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?Didact+Gothic&family=Limelight&display=swap" rel="stylesheet">
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo='>
  </head>
  <body>
    <h1>Cookbook</h1>
    <main>
      
      <form class='box' id='form'>
        <h2>Add Recipe</h2>
        <div>
          <label for='recipe-name'><strong>Recipe Name:</strong></label>
          <input type='text' id='recipe-name' value='' minlength = 1>
        </div>
        <div>
          <label for='ingredients'><strong>Ingredients:</strong></label>
          <textarea id='ingredients' minlength = 1 placeholder='Enter an ingredient and press the button to add it'></textarea>
          <button type='button' class='add'>Add ingredient</button>
          <ul id='ingredients-list'></ul>
        </div>
        <div>
          <label for='instructions'><strong>Instructions: </strong></label>
          <textarea id='instructions' minlength = 1 placeholder='Enter a step and press the button to add it'></textarea>
          <button type='button' class='add' >Add step</button>
          <ol id='instructions-list'></ol>
        </div>
        <div>
          <label for='cook-time'><strong>Cook time:</strong> </label>
          <input type='number' id='cook-time' value='0' min = 1 >
        </div>
        <button id="submit">Submit Recipe</button>
      </form>
      <section class='box' id='recipes'>
        <h2 id = 'all-recipes'>All Recipes</h2>
      </section>
    </main>
  </body>
</html>
